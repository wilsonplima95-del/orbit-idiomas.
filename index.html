<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091E28"><meta name="description" content="Pratique idiomas com constância profissional, mesmo offline."><link rel="manifest" href="manifest.webmanifest"><title>Orbit · Idiomas com propósito</title><style>
:root{--bg:#091e28;--card:#132f3d;--card2:#193b49;--cyan:#00e5ff;--mint:#10e794;--pink:#ff3366;--text:#f0f4f8;--muted:#9bb0ba;--line:#28505e;--shadow:0 16px 48px #00101880}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);overscroll-behavior-y:none;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:calc(84px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 80% 0%,#103849 0,transparent 38%),var(--bg)}button,input,select,textarea{font:inherit}button,a,[role=tab]{user-select:none;-webkit-user-select:none}button{min-width:44px;min-height:44px;border:0;border-radius:14px;padding:10px 14px;color:var(--text);background:var(--card2);cursor:pointer;transition:.18s transform,.18s background}button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--cyan);color:#03212a;font-weight:800}.soft{background:#00e5ff18;color:var(--cyan);border:1px solid #00e5ff38}.good{color:var(--mint)}.bad{color:var(--pink)}header{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 18px 12px;background:#091e28e8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0c;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.2px}.orb{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,var(--cyan),#4475ff);display:grid;place-items:center;color:#00212a;font-weight:900}.header-right{display:flex;align-items:center;gap:8px}.pill{font-size:12px;color:var(--muted);background:#ffffff0a;padding:8px 10px;border:1px solid #ffffff13;border-radius:99px}.lang{color:var(--cyan);font-weight:800}.container{width:min(100%,850px);margin:auto;padding:20px 18px}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}.title{font-size:clamp(28px,7vw,42px);line-height:1.05;letter-spacing:-1.4px;margin:10px 0}.sub{color:var(--muted);line-height:1.55}.hero{padding:20px 2px 24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px}.stat,.card{background:linear-gradient(155deg,#163644,#112c39);border:1px solid #ffffff0d;border-radius:20px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-size:21px;margin-bottom:3px}.stat small{color:var(--muted);font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-head h2{font-size:18px;margin:0}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.module{min-height:142px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;padding:16px;background:var(--card);border:1px solid #ffffff12;border-radius:18px}.module .ico{font-size:22px}.module b{font-size:15px}.module small{color:var(--muted);line-height:1.4}.module:hover,.node:hover{border-color:#00e5ff65}.track{display:grid;gap:10px}.node{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid #ffffff12;border-radius:17px;padding:13px;text-align:left}.node.lock{opacity:.55}.node-icon{width:42px;height:42px;border-radius:14px;background:#00e5ff17;display:grid;place-items:center;color:var(--cyan);font-weight:900;flex:none}.node.done .node-icon{background:#10e79420;color:var(--mint)}.node-info{flex:1}.node-info b{display:block;margin-bottom:4px}.node-info small{color:var(--muted)}.bar{height:6px;background:#ffffff12;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--mint);border-radius:10px}.bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#091e28ed;backdrop-filter:blur(18px);border-top:1px solid #ffffff12;display:grid;grid-template-columns:repeat(5,1fr)}.nav{background:transparent;min-height:52px;padding:5px 2px;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:3px}.nav span:first-child{font-size:18px}.nav.active{color:var(--cyan)}.page-title{font-size:27px;letter-spacing:-.7px;margin:8px 0}.lesson-tabs{display:flex;gap:7px;margin:16px 0}.tab{flex:1;background:#ffffff08;border:1px solid #ffffff14;color:var(--muted);font-size:12px;padding:8px 5px}.tab.selected{color:#06212a;background:var(--cyan);font-weight:800}.content{line-height:1.65;color:#d2e0e5}.content h3{color:var(--text);margin-bottom:4px}.example{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #ffffff10}.example>div{flex:1}.example b{display:block}.example small{color:var(--muted)}.example button{padding:5px;background:#ffffff0a}.answer{display:block;width:100%;text-align:left;margin:8px 0;border:1px solid #ffffff15;background:#ffffff08}.answer.chosen{border-color:var(--cyan);color:var(--cyan)}input,select,textarea{width:100%;padding:13px 14px;background:#081e28;border:1px solid var(--line);border-radius:13px;color:var(--text);outline:none;min-height:48px}textarea{resize:vertical;min-height:90px}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.notice{padding:12px;border-radius:13px;background:#00e5ff12;color:#bdeef3;line-height:1.5;font-size:13px;margin:12px 0}.notice.error{background:#ff336618;color:#ffc0ce}.notice.success{background:#10e79418;color:#a5f7d3}.profile-screen{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 75% 0%,#103849 0,transparent 40%),var(--bg);display:grid;place-items:center;padding:20px}.profile-box{width:min(100%,450px)}.profile-box .card{padding:22px}.chat{display:grid;gap:11px;margin:14px 0}.bubble{max-width:88%;padding:13px;border-radius:16px;background:var(--card2);line-height:1.5}.bubble.me{justify-self:end;background:#00e5ff20;border:1px solid #00e5ff32}.feedback{font-size:12px;color:var(--muted);border-left:2px solid var(--mint);padding:9px 11px;margin-top:8px}.pron-card{min-height:180px;display:grid;align-content:center;text-align:center;padding:20px}.mic{width:66px;height:66px;border-radius:50%;background:var(--cyan);color:#05232d;font-size:24px;box-shadow:0 0 0 8px #00e5ff18}.center{text-align:center}.toast{position:fixed;z-index:12;bottom:100px;left:50%;transform:translateX(-50%);background:#f0f4f8;color:#091e28;padding:11px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow)}.hide{display:none!important}.profile-line{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #ffffff12}.profile-line:last-child{border:0}.scenario{width:100%;text-align:left;padding:14px;margin:6px 0}.tiny{font-size:11px;color:var(--muted)}@media(min-width:700px){.container{padding-top:28px}.track{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-height:680px){body{padding-bottom:70px}.container{padding-top:12px}.pron-card{min-height:120px}.bottom{padding-bottom:env(safe-area-inset-bottom)}}
</style></head><body><header><div class="brand"><div class="orb">O</div>orbit<span class="tiny">· idiomas</span></div><div class="header-right"><button class="soft lang" id="langBtn" aria-label="Alternar idioma">EN ▾</button><span class="pill" id="xpPill">0 XP</span><button id="profileBtn" class="pill">Perfil</button></div></header><main id="app" class="container"></main><nav class="bottom" id="nav"></nav><div id="toast" class="toast hide"></div><div id="profileGate" class="profile-screen hide"></div><script>
const LANGS={EN:{name:'Inglês',voice:'en-US',hello:'Good morning. I would like to discuss the project timeline.',thanks:'Thank you for the update. I will review it today.',meeting:'Could we schedule a meeting for Thursday?',report:'I have completed the first draft of the report.',clarify:'Could you clarify the next steps?',deadline:'We may need to adjust the deadline.',confirm:'I can confirm the budget by tomorrow.',suggest:'I suggest we prioritize the client request.'},ES:{name:'Espanhol',voice:'es-ES',hello:'Buenos días. Me gustaría hablar sobre el cronograma del proyecto.',thanks:'Gracias por la actualización. Lo revisaré hoy.',meeting:'¿Podríamos programar una reunión para el jueves?',report:'He terminado el primer borrador del informe.',clarify:'¿Podrías aclarar los próximos pasos?',deadline:'Quizás tengamos que ajustar la fecha límite.',confirm:'Puedo confirmar el presupuesto mañana.',suggest:'Sugiero que prioricemos la solicitud del cliente.'},DE:{name:'Alemão',voice:'de-DE',hello:'Guten Morgen. Ich möchte über den Projektzeitplan sprechen.',thanks:'Vielen Dank für die Aktualisierung. Ich prüfe sie heute.',meeting:'Könnten wir für Donnerstag ein Meeting vereinbaren?',report:'Ich habe den ersten Entwurf des Berichts fertiggestellt.',clarify:'Könnten Sie die nächsten Schritte erläutern?',deadline:'Möglicherweise müssen wir die Frist anpassen.',confirm:'Ich kann das Budget bis morgen bestätigen.',suggest:'Ich schlage vor, dass wir die Kundenanfrage priorisieren.'},FR:{name:'Francês',voice:'fr-FR',hello:'Bonjour. Je voudrais parler du calendrier du projet.',thanks:'Merci pour la mise à jour. Je vais la vérifier aujourd’hui.',meeting:'Pourrions-nous prévoir une réunion jeudi ?',report:'J’ai terminé la première version du rapport.',clarify:'Pourriez-vous préciser les prochaines étapes ?',deadline:'Nous devrons peut-être ajuster le délai.',confirm:'Je peux confirmer le budget demain.',suggest:'Je propose de donner la priorité à la demande du client.'},IT:{name:'Italiano',voice:'it-IT',hello:'Buongiorno. Vorrei parlare del calendario del progetto.',thanks:'Grazie per l’aggiornamento. Lo esaminerò oggi.',meeting:'Potremmo fissare una riunione per giovedì?',report:'Ho completato la prima bozza del rapporto.',clarify:'Potrebbe chiarire i prossimi passi?',deadline:'Potremmo dover modificare la scadenza.',confirm:'Posso confermare il budget entro domani.',suggest:'Suggerisco di dare priorità alla richiesta del cliente.'}};
const LANG_KEYS=Object.keys(LANGS), WORDS=['hello','thanks','meeting','report','clarify','deadline','confirm','suggest'];const TRAN={hello:'Bom dia. Gostaria de conversar sobre o cronograma do projeto.',thanks:'Obrigado pela atualização. Vou revisá-la hoje.',meeting:'Poderíamos marcar uma reunião para quinta-feira?',report:'Concluí o primeiro rascunho do relatório.',clarify:'Você poderia esclarecer os próximos passos?',deadline:'Talvez precisemos ajustar o prazo.',confirm:'Posso confirmar o orçamento até amanhã.',suggest:'Sugiro priorizarmos a solicitação do cliente.'};const NAV=[['home','⌂','Início'],['trail','◉','Trilha'],['speak','◖','Falar'],['dialog','▤','Diálogos'],['more','⋯','Mais']];
let db=load(),view='home',lessonTab='theory',lessonId=0,chatScenario=null,selectedAnswer=-1,challengeIndex=0;function seed(){return {active:null,profiles:[],}}function load(){try{return JSON.parse(localStorage.getItem('orbit_v1'))||seed()}catch{return seed()}}function save(){localStorage.setItem('orbit_v1',JSON.stringify(db))}function profile(){return db.profiles.find(p=>p.id===db.active)}function langData(p=profile(),l=p?.lang||'EN'){if(!p)return null;p.languages[l]??={xp:0,streak:0,done:[],cycleDone:[],cycle:shuffle([...WORDS]),history:[],unlocked:1,lastDay:''};return p.languages[l]}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2200)}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function talk(text){if(!('speechSynthesis'in window)){toast('Áudio não disponível neste dispositivo.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANGS[profile().lang].voice;speechSynthesis.speak(u)}
function setProfile(id){db.active=id;save();render()}function renderNav(){document.querySelector('#nav').innerHTML=NAV.map(([id,ic,t])=>`<button class="nav ${view===id?'active':''}" data-view="${id}"><span>${ic}</span>${t}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}function render(){renderNav();const p=profile();document.querySelector('#profileGate').classList.toggle('hide',!!p);document.querySelector('#app').classList.toggle('hide',!p);document.querySelector('#nav').classList.toggle('hide',!p);document.querySelector('#langBtn').textContent=(p?p.lang:'EN')+' ▾';document.querySelector('#xpPill').textContent=(p?langData().xp:0)+' XP';document.querySelector('#profileBtn').textContent=p?p.name:'Entrar';if(!p){renderGate();return}if(view==='lesson')lesson();else ({home,trail,speak,dialog,more}[view]||home)();}
function renderGate(){const g=document.querySelector('#profileGate');if(db.profiles.length){g.innerHTML=`<div class="profile-box"><div class="hero"><div class="orb">O</div><div class="eyebrow" style="margin-top:15px">Seu espaço de prática</div><h1 class="title">Quem vai aprender hoje?</h1><p class="sub">Seu progresso fica guardado neste dispositivo.</p></div><div class="card">${db.profiles.map(x=>`<button class="scenario" data-id="${x.id}"><b>${safe(x.name)}</b><span class="tiny"> · ${safe(x.area)}</span></button>`).join('')}<button class="soft" id="newProfile" style="width:100%;margin-top:10px">＋ Criar perfil</button></div></div>`;g.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>pinPrompt(b.dataset.id));g.querySelector('#newProfile').onclick=()=>gateForm(g)}else gateForm(g)}function gateForm(g){g.innerHTML=`<div class="profile-box"><div class="hero"><div class="orb">O</div><div class="eyebrow" style="margin-top:15px">Seu espaço de prática</div><h1 class="title">Uma conversa melhor começa aqui.</h1><p class="sub">Aprenda um pouco todos os dias, com foco no seu contexto profissional.</p></div><form class="card" id="createForm"><label>Como podemos chamar você?</label><input name="name" required placeholder="Seu nome"><div class="row"><div><label>Área de atuação</label><select name="area"><option>Livre / Geral</option><option>Tecnologia</option><option>Negócios</option><option>Saúde</option><option>Finanças</option><option>Engenharia</option><option>Criativo</option></select></div><div><label>Formação</label><select name="education"><option>Não quero informar</option><option>Básico</option><option>Superior</option></select></div></div><div class="row"><div><label>Nível de estudo</label><select name="level"><option>A1</option><option>A1 Plus</option><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select></div><div><label>PIN de 4 dígitos</label><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Opcional"></div></div><button class="primary" style="width:100%;margin-top:16px">Começar minha jornada →</button></form></div>`;g.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p={id:crypto.randomUUID(),name:f.get('name').trim(),area:f.get('area'),education:f.get('education'),level:f.get('level'),pin:f.get('pin'),lang:'EN',languages:{}};db.profiles.push(p);db.active=p.id;langData(p);save();render()}}
function pinPrompt(id){const p=db.profiles.find(x=>x.id===id);if(!p.pin){setProfile(id);return}const v=prompt(`PIN de ${p.name}`);if(v===p.pin)setProfile(id);else if(v!==null)toast('PIN incorreto.')}function home(){const p=profile(),d=langData(),progress=Math.round(d.done.length/8*100);document.querySelector('#app').innerHTML=`<section class="hero"><div class="eyebrow">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · ${LANGS[p.lang].name}</div><h1 class="title">Olá, ${safe(p.name)}.<br><span style="color:var(--cyan)">Vamos avançar?</span></h1><p class="sub">Uma prática curta hoje mantém sua confiança em movimento.</p></section><div class="stats"><div class="stat"><b>${d.xp}</b><small>XP neste idioma</small></div><div class="stat"><b>🔥 ${d.streak}</b><small>dias de constância</small></div><div class="stat"><b>${d.done.length}/6</b><small>marcos concluídos</small></div></div><div class="card"><div class="section-head" style="margin:0 0 8px"><h2>Seu próximo passo</h2><span class="tiny">Fase ${Math.floor((d.unlocked-1)/8)+1}</span></div><div class="bar"><i style="width:${progress}%"></i></div><p class="sub" style="font-size:13px">${progress}% da fase atual concluída</p><button class="primary" style="width:100%" onclick="view='trail';render()">Continuar trilha →</button></div><div class="section-head"><h2>Prática rápida</h2></div><div class="grid two"><button class="module" onclick="view='speak';render()"><span class="ico">◖</span><b>Laboratório de fala</b><small>Treine pronúncia em poucos minutos</small></button><button class="module" onclick="view='dialog';render()"><span class="ico">▤</span><b>Conversa guiada</b><small>Pratique situações do seu trabalho</small></button></div><div class="section-head"><h2>Desafio do dia</h2><button class="soft" onclick="daily()">↻ Novo desafio</button></div><div id="dailyBox" class="card"><span class="eyebrow">${LANGS[p.lang].name} · 2 min</span><p>${LANGS[p.lang][WORDS[new Date().getDate()%WORDS.length]]}</p><button class="soft" onclick="talk(document.querySelector('#dailyBox p').textContent)">▶ Ouvir exemplo</button></div>`}
const MARKS=[['Apresentações profissionais','Pronomes, verbo “ser/estar” e apresentações objetivas.'],['Rotina e prioridades','Presente simples, frequência e organização da jornada.'],['Pedidos e cortesia','Perguntas, imperativos e formas educadas de pedir.'],['Reuniões produtivas','Perguntas indiretas, turnos de fala e alinhamentos.'],['Prazos e possibilidades','Futuro, modais de possibilidade e gestão de prazos.'],['Conectores e argumentos','Causa, contraste, sequência e defesa de ideias.'],['Relatórios claros','Passado, resultados e estrutura de síntese.'],['Negociação e decisão','Condicionais, propostas, contrapontos e fechamento.']];const PHASES=['Base profissional · A1','Comunicação cotidiana · A2','Colaboração fluida · B1','Autonomia profissional · B2','Precisão e influência · C1','Domínio e nuance · C2'];function trail(){const d=langData(),phase=Math.floor((d.unlocked-1)/8),all=[];for(let i=0;i<8;i++){const global=(phase*8)+i,done=d.done.includes(global),unlock=global<d.unlocked;all.push(`<button class="node ${done?'done':''} ${unlock?'':'lock'}" data-id="${global}" ${unlock?'':'disabled'}><span class="node-icon">${done?'✓':String(i+1).padStart(2,'0')}</span><span class="node-info"><b>${MARKS[i][0]}</b><small>${MARKS[i][1]}</small></span><span>${unlock?'›':'🔒'}</span></button>`)}document.querySelector('#app').innerHTML=`<div class="eyebrow">Jornada contínua · fase ${phase+1}</div><h1 class="page-title">${PHASES[phase%6]}</h1><p class="sub">Avance marco a marco. Uma nota mínima de 75% libera o próximo.</p><div class="track">${all.join('')}</div><div class="card" style="margin-top:15px"><b>♾ A trilha continua</b><p class="sub" style="font-size:13px">Ao completar os marcos, novas fases avançadas são abertas automaticamente. Revisite o conteúdo sempre que quiser.</p><button class="soft" onclick="review()">↻ Modo revisão dinâmica</button></div>`;document.querySelectorAll('.node:not(.lock)').forEach(b=>b.onclick=()=>{lessonId=+b.dataset.id;view='lesson';lessonTab='theory';selectedAnswer=-1;render()})}
function lesson(){const d=langData(),idx=lessonId%8,done=d.done.includes(lessonId),type=lessonTab;let body='';if(type==='theory')body=`<div class="content"><div class="eyebrow">Aula em português · ${PHASES[Math.floor(lessonId/8)%6]}</div><h3>${MARKS[idx][0]}</h3><p>${MARKS[idx][1]} O objetivo é comunicar com clareza e intenção. Observe primeiro quem pratica a ação, depois a ação e, por fim, o contexto que completa a mensagem.</p><h3>Como aplicar</h3><p>Em situações profissionais, comece com uma ideia central por frase. Use conectores para mostrar causa, contraste ou sequência. A forma verbal ajuda a situar a ação; advérbios de frequência e tempo refinam o contexto.</p><div class="notice">Dica de estudo: leia os exemplos em voz alta. Repare na ordem das palavras e no ritmo antes de tentar acelerar.</div><h3>Estratégia de fala</h3><p>Prepare uma frase curta, acrescente um detalhe concreto e feche com uma pergunta ou próximo passo. Essa estrutura facilita reuniões, atualizações e pedidos de esclarecimento.</p></div>`;if(type==='examples')body=WORDS.slice(0,8).map(w=>`<div class="example"><div><b>${LANGS[profile().lang][w]}</b><small>${TRAN[w]}</small></div><button aria-label="Ouvir" onclick="talk(${JSON.stringify(LANGS[profile().lang][w])})">▶</button></div>`).join('');if(type==='quiz'){const q=lessonId%2===0?['Como dizer “Poderíamos marcar uma reunião para quinta-feira?”','meeting','thanks','report','hello']:['Como dizer “Concluí o primeiro rascunho do relatório.”','report','hello','meeting','suggest'];body=`<div class="content"><div class="eyebrow">Quiz · nota mínima 75%</div><h3>${q[0]}</h3>${q.slice(1).map((w,i)=>`<button class="answer ${selectedAnswer===i?'chosen':''}" data-a="${i}">${LANGS[profile().lang][w]}</button>`).join('')}<button class="primary" id="checkQuiz" style="width:100%;margin-top:10px">Conferir resposta</button><div id="quizResult"></div></div>`}document.querySelector('#app').innerHTML=`<button class="soft" onclick="view='trail';render()">← Voltar à trilha</button><h1 class="page-title">${MARKS[idx][0]}</h1><div class="lesson-tabs">${[['theory','Teoria'],['examples','Exemplos'],['quiz','Quiz']].map(([id,name])=>`<button class="tab ${type===id?'selected':''}" data-tab="${id}">${name}</button>`).join('')}</div><section class="card">${body}</section>${done?'<div class="notice success">✓ Marco concluído. Você pode revisar quando quiser.</div>':''}`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{lessonTab=b.dataset.tab;render()});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{selectedAnswer=+b.dataset.a;lesson()});document.querySelector('#checkQuiz')?.addEventListener('click',()=>{const box=document.querySelector('#quizResult');if(selectedAnswer===0){box.innerHTML='<div class="notice success">Resposta correta! Nota 100%. Marco liberado.</div>';if(!d.done.includes(lessonId)){d.done.push(lessonId);d.xp+=25;d.unlocked=Math.max(d.unlocked,lessonId+2);save();document.querySelector('#xpPill').textContent=d.xp+' XP'}}else box.innerHTML='<div class="notice error">Ainda não. Reveja os exemplos e tente novamente. O avanço segue bloqueado até atingir 75%.</div>'})}
function speak(){const p=profile(),d=langData(),key=d.cycle.find(w=>!d.cycleDone.includes(w))||d.cycle[0],text=LANGS[p.lang][key],done=d.cycleDone.includes(key);document.querySelector('#app').innerHTML=`<div class="eyebrow">Treino de pronúncia · ciclo ${Math.floor(d.cycleDone.length/8)+1}</div><h1 class="page-title">Laboratório de fala</h1><p class="sub">Ouça, repita e registre seu progresso em uma sessão curta.</p><section class="card pron-card"><button class="soft" style="justify-self:center" onclick="talk(${JSON.stringify(text)})">▶ Ouvir frase</button><h2 style="font-size:21px;line-height:1.4">${text}</h2><p class="sub">${TRAN[key]}</p></section><div class="center" style="margin:19px 0 12px"><button class="mic" id="mic" aria-label="Gravar pronúncia">🎙</button><p class="tiny" id="micHint">Toque para falar ou marque a prática</p></div><div id="speechFeedback" class="card tiny">${done?'✓ Frase praticada neste ciclo.':'Seu progresso de pronúncia fica salvo neste dispositivo.'}</div><div class="row" style="margin-top:12px"><button class="soft" onclick="pronounceDone('${key}')">✓ Marcar praticada</button><button class="primary" onclick="newCycle()">Novo ciclo ↻</button></div>`;document.querySelector('#mic').onclick=recognize}function pronounceDone(k){const d=langData();if(!d.cycleDone.includes(k)){d.cycleDone.push(k);d.history.push({key:k,date:new Date().toISOString()});d.xp+=5;save()}speak()}function newCycle(){const d=langData();d.cycleDone=[];d.cycle=shuffle([...WORDS]);save();toast('Novo ciclo pronto');speak()}function recognize(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.querySelector('#speechFeedback').textContent='O reconhecimento de voz não está disponível neste navegador. Use “Marcar praticada” para registrar a sessão offline.';return}const r=new SR();r.lang=LANGS[profile().lang].voice;r.onstart=()=>document.querySelector('#micHint').textContent='Ouvindo…';r.onresult=e=>{const said=e.results[0][0].transcript;document.querySelector('#speechFeedback').innerHTML=`Você disse: <b>${safe(said)}</b><br><small>Compare com a frase alvo e marque a prática se concluiu.</small>`};r.onerror=()=>document.querySelector('#micHint').textContent='Não foi possível captar. Tente novamente.';r.onend=()=>document.querySelector('#micHint').textContent='Toque para falar';r.start()}
const SCENARIOS=[['daily','Alinhamento diário','Atualize uma pessoa da equipe sobre o andamento de uma tarefa.'],['meeting','Entrar em uma reunião','Apresente-se e explique o objetivo da conversa.'],['client','Conversa com cliente','Responda a uma dúvida e combine o próximo passo.'],['interview','Entrevista profissional','Fale sobre suas responsabilidades e experiência.']];function dialog(){if(chatScenario){chat();return}document.querySelector('#app').innerHTML=`<div class="eyebrow">Prática contextual · ${safe(profile().area)}</div><h1 class="page-title">Conversas do trabalho</h1><p class="sub">Escolha um cenário. Responda por texto para praticar offline ou use o microfone se disponível.</p>${SCENARIOS.map(([id,t,s])=>`<button class="scenario card" data-sc="${id}"><b>${t}</b><p class="sub" style="font-size:13px;margin:6px 0 0">${s}</p><span class="eyebrow" style="margin-top:12px">Começar conversa →</span></button>`).join('')}<div class="notice">Os diálogos e o feedback pedagógico funcionam localmente. Reconhecimento de fala depende do suporte do navegador e pode exigir rede.</div>`;document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{chatScenario=b.dataset.sc;chatHistory=[];chat()})}let chatHistory=[];function chat(){const sc=SCENARIOS.find(x=>x[0]===chatScenario),prompt=LANGS[profile().lang].hello;document.querySelector('#app').innerHTML=`<button class="soft" onclick="chatScenario=null;view='dialog';render()">← Cenários</button><h1 class="page-title">${sc[1]}</h1><p class="sub">${sc[2]}</p><div class="chat"><div class="bubble"><b>Instrutor</b><br>${prompt}<div class="tiny" style="margin-top:6px">${TRAN.hello}</div></div>${chatHistory.map(m=>`<div class="bubble me">${safe(m.text)}<div class="feedback"><b>${m.ok?'✓ A frase está clara':'↗ Vamos ajustar juntos'}</b><br>${m.note}<br><span>Em português: ${m.pt}</span></div></div><div class="bubble"><b>Instrutor</b><br>${m.reply}<div class="tiny" style="margin-top:6px">${m.replyPt}</div></div>`).join('')}</div><div class="row"><input id="chatInput" placeholder="Escreva sua resposta…"><button class="soft" id="chatMic">🎙</button></div><div class="row" style="margin-top:8px"><button class="soft" onclick="previewReply()">▶ Ouvir sugestão</button><button class="primary" onclick="sendReply()">Enviar →</button></div>`;document.querySelector('#chatMic').onclick=recognizeChat}function feedbackFor(text){const lang=profile().lang,ok=text.trim().length>12;const notes={EN:'Use uma frase completa e inclua uma ação ou detalhe específico. Observe a ordem sujeito + verbo + complemento.',ES:'Forme uma frase completa e inclua uma ação específica. Observe a concordância do verbo com o sujeito.',DE:'Forme uma frase completa; em orações principais, o verbo conjugado costuma ocupar a segunda posição.',FR:'Forme uma frase completa e confira a concordância entre sujeito e verbo.',IT:'Forme uma frase completa e confira a concordância entre sujeito e verbo.'};return {ok,note:ok?'Boa base. Para soar mais natural, acrescente contexto e finalize com um próximo passo. '+notes[lang]:notes[lang],pt:ok?'Sua frase é compreensível. Para soar mais natural, acrescente contexto e finalize com um próximo passo. '+notes[lang]:'Tente criar uma frase um pouco mais completa. '+notes[lang],reply:LANGS[lang][ok?'thanks':'clarify'],replyPt:TRAN[ok?'thanks':'clarify']}}function sendReply(){const input=document.querySelector('#chatInput'),text=input.value.trim();if(!text){toast('Escreva ou dite uma resposta primeiro.');return}const f=feedbackFor(text);chatHistory.push({text,...f});langData().xp+=5;save();chat()}function previewReply(){const text=document.querySelector('#chatInput').value.trim()||LANGS[profile().lang].thanks;talk(text)}function recognizeChat(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Ditado indisponível; digite sua resposta offline.');return}const r=new SR();r.lang=LANGS[profile().lang].voice;r.onresult=e=>{document.querySelector('#chatInput').value=e.results[0][0].transcript};r.start()}
const PHON={EN:[['th','Língua entre os dentes; sopro leve.','think'],['sh','Som contínuo como “ch”.','share'],['ea','Pode soar longo em “team”.','team'],['r','Som retroflexo, sem vibrar a ponta.','report']],ES:[['j','Som aspirado, parecido com “rr” suave.','jefe'],['ll','Varia regionalmente entre “lh” e “i”.','llamada'],['ñ','Som de “nh”.','año'],['rr','Vibração forte da língua.','reunión']],DE:[['ch','Após vogal anterior, som fricativo suave.','ich'],['sch','Combinação com som de “x”.','Schule'],['ei','Lê-se como “ai”.','Zeit'],['ie','Lê-se como “i” longo.','Sie']],FR:[['ou','Lê-se como “u”.','vous'],['eau','Lê-se como “ô”.','bureau'],['on','Vogal nasal: o ar ressoa pelo nariz.','bonjour'],['ch','Lê-se como “x”.','chercher']],IT:[['ch','Mantém o som de “k” antes de e/i.','chi'],['gn','Som de “nh”.','riunione'],['gli','Som palatal aproximado a “lh”.','famiglia'],['sc','Antes de e/i, som de “sh”.','scena']]};const VOCAB=[['deadline','prazo'],['meeting','reunião'],['feedback','retorno / avaliação'],['budget','orçamento'],['stakeholder','parte interessada'],['to deliver','entregar'],['to align','alinhar'],['outcome','resultado'],['schedule','cronograma'],['request','solicitação']];function more(){document.querySelector('#app').innerHTML=`<div class="eyebrow">Ferramentas de apoio · ${LANGS[profile().lang].name}</div><h1 class="page-title">Aprenda com intenção</h1><div class="grid two"><button class="module" onclick="view='phonetics';render()"><span class="ico">◉</span><b>Guia de fonética</b><small>Sons, vogais e combinações</small></button><button class="module" onclick="view='glossary';render()"><span class="ico">▤</span><b>Glossário & estrutura</b><small>Vocabulário útil e ordem das frases</small></button><button class="module" onclick="review()"><span class="ico">↻</span><b>Revisão dinâmica</b><small>Reforce o que já estudou</small></button><button class="module" onclick="view='settings';render()"><span class="ico">⚙</span><b>Perfil & dados</b><small>Preferências e privacidade local</small></button></div>`}function phonetics(){const list=PHON[profile().lang];document.querySelector('#app').innerHTML=`<button class="soft" onclick="view='more';render()">← Voltar</button><h1 class="page-title">Guia de fonética</h1><p class="sub">Pistas de pronúncia explicadas em português. Ouça cada exemplo.</p><section class="card">${list.map(([g,desc,ex])=>`<div class="profile-line"><div><b style="color:var(--cyan);font-size:18px">${g}</b><div class="tiny">${desc}</div><small>${ex}</small></div><button class="soft" onclick="talk(${JSON.stringify(ex)})">▶</button></div>`).join('')}</section><div class="notice">A pronúncia gerada usa as vozes instaladas no dispositivo. A disponibilidade e a qualidade variam conforme o WebView.</div>`}function glossary(){document.querySelector('#app').innerHTML=`<button class="soft" onclick="view='more';render()">← Voltar</button><h1 class="page-title">Glossário & estrutura</h1><p class="sub">Vocabulário profissional frequente e um mapa simples para organizar ideias.</p><section class="card">${VOCAB.map(([a,b])=>`<div class="profile-line"><span>${a}</span><small>${b}</small></div>`).join('')}</section><div class="section-head"><h2>Monte a frase</h2></div><div class="card"><div class="profile-line"><b>1 · Sujeito</b><small>Quem faz?</small></div><div class="profile-line"><b>2 · Verbo</b><small>Qual ação?</small></div><div class="profile-line"><b>3 · Complemento</b><small>O quê? Para quem?</small></div><div class="profile-line"><b>4 · Contexto</b><small>Quando, onde ou como?</small></div><p class="tiny">Sujeito → verbo → complemento → contexto. Em perguntas e algumas orações subordinadas, a ordem pode mudar conforme o idioma.</p></div>`}function settings(){const p=profile(),d=langData();document.querySelector('#app').innerHTML=`<button class="soft" onclick="view='more';render()">← Voltar</button><h1 class="page-title">Perfil & dados</h1><section class="card"><div class="profile-line"><b>${safe(p.name)}</b><small>${safe(p.level)} · ${safe(p.area)}</small></div><label>Idioma de estudo</label><div class="row">${LANG_KEYS.map(l=>`<button class="${l===p.lang?'primary':'soft'}" data-l="${l}">${l}</button>`).join('')}</div><p class="tiny">Cada idioma tem XP, marcos, ofensiva e histórico de pronúncia próprios.</p><div class="profile-line"><span>Dados locais</span><small>Salvos somente neste dispositivo</small></div><button class="soft" style="width:100%;margin-top:12px" onclick="switchProfile()">Trocar perfil</button></section><div class="notice">Áudio por síntese usa recursos do sistema. Nenhuma biblioteca ou serviço externo é carregado.</div>`;document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{p.lang=b.dataset.l;langData(p);save();render()})}function review(){const d=langData();if(!d.done.length){toast('Conclua um marco para iniciar a revisão.');return}lessonId=d.done[Math.floor(Math.random()*d.done.length)];view='lesson';lessonTab=['theory','examples','quiz'][Math.floor(Math.random()*3)];render()}function daily(){challengeIndex++;const k=WORDS[(new Date().getDate()+challengeIndex)%WORDS.length];document.querySelector('#dailyBox').innerHTML=`<span class="eyebrow">Desafio ${challengeIndex} · ${LANGS[profile().lang].name}</span><p>${LANGS[profile().lang][k]}</p><small class="sub">${TRAN[k]}</small><br><button class="soft" style="margin-top:10px" onclick="talk(document.querySelector('#dailyBox p').textContent)">▶ Ouvir exemplo</button>`}function switchProfile(){db.active=null;render()}document.querySelector('#profileBtn').onclick=()=>switchProfile();document.querySelector('#langBtn').onclick=()=>{if(!profile())return;const i=LANG_KEYS.indexOf(profile().lang);profile().lang=LANG_KEYS[(i+1)%5];langData();save();render();toast('Idioma: '+LANGS[profile().lang].name)};
document.addEventListener('click',e=>{if(e.target.closest('[data-view]'))return});function pinPrompt(id){const p=db.profiles.find(x=>x.id===id);if(!p.pin){setProfile(id);return}const g=document.querySelector('#profileGate');g.innerHTML=`<div class="profile-box card"><h2>Olá, ${safe(p.name)}</h2><p class="sub">Digite seu PIN para abrir o perfil.</p><input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="PIN de 4 dígitos"><button class="primary" style="width:100%;margin-top:12px" id="unlock">Desbloquear</button><button class="soft" style="width:100%;margin-top:8px" id="backProfiles">Voltar</button></div>`;g.querySelector('#unlock').onclick=()=>g.querySelector('#pinInput').value===p.pin?setProfile(id):toast('PIN incorreto.');g.querySelector('#backProfiles').onclick=renderGate}
function start(){if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render()}start();
</script><script src="./enhancements.js"></script></body></html>
